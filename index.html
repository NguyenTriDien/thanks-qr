<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chào buổi sáng, LA 🔮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,500;1,400&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #ff8fab;
    --rose-deep: #e75480;
    --peach: #ffc4a3;
    --gold: #ffd98e;
    --cream: #fff8f0;
    --ink: #5a3d4b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Be Vietnam Pro', system-ui, sans-serif;
    color: var(--ink);
    cursor: default;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Bầu trời bình minh ---------- */
  .sky {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, #2b1e3f 0%, #6b3f69 35%, #d77a8f 65%, #ffc3a0 100%);
    animation: dawn 5s ease-out forwards;
    z-index: 0;
  }
  .sky::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, #ffd6e0 0%, #ffe5d4 45%, #fff1e0 75%, #fff8ef 100%);
    opacity: 0;
    animation: dayLight 5s ease-out forwards;
  }
  @keyframes dayLight { to { opacity: 1; } }

  /* Mặt trời */
  .sun {
    position: fixed; left: 50%; bottom: -220px;
    width: 260px; height: 260px; border-radius: 50%;
    transform: translateX(-50%);
    background: radial-gradient(circle, #fff6d8 0%, #ffe09a 40%, #ffb38a 70%, rgba(255,160,140,0) 72%);
    box-shadow: 0 0 120px 60px rgba(255, 205, 150, .55), 0 0 260px 140px rgba(255, 170, 170, .35);
    animation: rise 4s cubic-bezier(.2,.7,.2,1) forwards, pulse 5s ease-in-out 4s infinite;
    z-index: 1;
  }
  @keyframes rise { to { bottom: 58%; } }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 120px 60px rgba(255,205,150,.55), 0 0 260px 140px rgba(255,170,170,.35); }
    50%     { box-shadow: 0 0 150px 80px rgba(255,205,150,.65), 0 0 320px 170px rgba(255,170,170,.4); }
  }
  .rays {
    position: fixed; left: 50%; top: 50%;
    width: 1400px; height: 1400px; margin: -700px 0 0 -700px;
    background: repeating-conic-gradient(from 0deg, rgba(255,230,190,.16) 0deg 6deg, transparent 6deg 18deg);
    mask-image: radial-gradient(circle, #000 0%, transparent 60%);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 60%);
    opacity: 0; z-index: 1;
    animation: raysIn 2s ease 3s forwards, spin 90s linear infinite;
  }
  @keyframes raysIn { to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Mây */
  .cloud {
    position: fixed; z-index: 2; opacity: .85;
    filter: blur(1px);
    animation: drift linear infinite;
  }
  .cloud span {
    position: absolute; background: #fff; border-radius: 50%;
    box-shadow: 0 10px 30px rgba(231, 84, 128, .12);
  }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

  canvas#fx { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

  /* ---------- Nội dung ---------- */
  .stage {
    position: relative; z-index: 5;
    height: 100%;
    display: flex; align-items: safe center; justify-content: center;
    padding: 24px 24px 56px;
    overflow-y: auto; overflow-x: hidden;
  }
  .card { margin: auto 0; flex-shrink: 0; }

  /* Phong thư */
  .envelope-wrap {
    position: absolute; text-align: center;
    opacity: 0; animation: fadeUp .8s ease 1s forwards;
    transition: opacity .8s ease, transform .8s ease;
  }
  .envelope-wrap.gone { opacity: 0 !important; transform: scale(.85) translateY(30px); pointer-events: none; }
  .envelope {
    position: relative; width: 300px; height: 200px; margin: 0 auto;
    cursor: pointer;
    animation: float 3.6s ease-in-out infinite;
    filter: drop-shadow(0 20px 40px rgba(231, 84, 128, .3));
  }
  .envelope .body {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #ffe3ea, #ffd0dc);
    border-radius: 10px;
  }
  .envelope .flap {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    clip-path: polygon(0 0, 100% 0, 50% 58%);
    background: linear-gradient(180deg, #ffb6c8, #ff9fb8);
    border-radius: 10px 10px 0 0;
    transform-origin: top; transition: transform .8s ease;
    z-index: 3;
  }
  .envelope .pocket {
    position: absolute; inset: 0;
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
    background: linear-gradient(160deg, #ffc9d6, #ffb3c6);
    border-radius: 10px; z-index: 2;
  }
  .envelope .seal {
    position: absolute; left: 50%; top: 50%; z-index: 4;
    width: 58px; height: 58px; margin: -34px 0 0 -29px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff6f91, #c9184a);
    display: grid; place-items: center;
    color: #fff; font-size: 26px;
    box-shadow: 0 4px 12px rgba(201,24,74,.45), inset 0 -3px 6px rgba(0,0,0,.2);
    animation: heartbeat 1.4s ease-in-out infinite;
  }
  .envelope.open .flap { transform: rotateX(180deg); }
  .envelope.open .seal { opacity: 0; transition: opacity .3s; }
  .hint {
    margin-top: 28px;
    font-family: 'Dancing Script', cursive; font-size: 26px;
    color: var(--rose-deep);
    animation: blink 2.2s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-14px) rotate(1deg); } }
  @keyframes heartbeat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
  @keyframes blink { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  /* Thiệp */
  .card {
    position: relative; width: min(560px, 92vw);
    padding: 54px 44px 44px;
    text-align: center;
    background: rgba(255, 250, 247, .55);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, .8);
    border-radius: 32px;
    box-shadow: 0 30px 80px rgba(201, 24, 74, .18), inset 0 1px 0 rgba(255,255,255,.9);
    opacity: 0; transform: translateY(40px) scale(.96);
    pointer-events: none;
    transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.8,.2,1);
  }
  .card.show { opacity: 1; transform: none; pointer-events: auto; }
  .card::before {
    content: ""; position: absolute; inset: -2px; border-radius: 34px; z-index: -1;
    background: conic-gradient(from var(--a, 0deg), #ffb3c6, #ffd98e, #ffc4a3, #ff8fab, #ffb3c6);
    filter: blur(14px); opacity: .55;
    animation: halo 8s linear infinite;
  }
  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes halo { to { --a: 360deg; } }

  .greet-time {
    font-size: 13px; letter-spacing: .35em; text-transform: uppercase;
    color: #b0697f; font-weight: 500;
  }
  .hello {
    margin-top: 10px;
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(22px, 4vw, 30px); color: #8a4b63;
  }
  .name {
    font-family: 'Dancing Script', cursive; font-weight: 700;
    font-size: clamp(96px, 20vw, 150px); line-height: 1;
    margin: 4px 0 6px;
    filter: drop-shadow(0 6px 18px rgba(231, 84, 128, .3));
    display: inline-block; position: relative;
  }
  .name .l {
    display: inline-block; opacity: 0; transform: translateY(30px) rotate(-8deg);
    padding: 0 .04em;
    background: linear-gradient(100deg, #e75480 0%, #ff8fab 25%, #ffc46b 45%, #ff8fab 65%, #e75480 100%);
    background-size: 250% auto;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
  }
  .card.show .name .l { animation: letterIn 1.1s cubic-bezier(.2,.9,.3,1.3) forwards, shimmer 5s linear infinite; }
  .card.show .name .l:nth-child(2) { animation-delay: .25s, 0s; }
  @keyframes letterIn { to { opacity: 1; transform: none; } }
  @keyframes shimmer { to { background-position: -250% center; } }

  .mini-heart {
    position: absolute; right: -18px; top: 8px; font-size: 26px;
    -webkit-text-fill-color: initial; color: #ff5c8a;
    animation: heartbeat 1.6s ease-in-out infinite;
  }

  .badges {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    margin-top: 6px;
  }
  .badge {
    font-size: 12px; font-weight: 500; letter-spacing: .02em;
    padding: 6px 12px; border-radius: 999px;
    color: #7b3b8f;
    background: linear-gradient(135deg, rgba(214,180,255,.45), rgba(255,182,206,.45));
    box-shadow: inset 0 0 0 1px rgba(155,89,182,.25);
    opacity: 0; transform: translateY(8px);
  }
  .card.show .badge { animation: fadeUp .8s ease forwards; }
  .card.show .badge:nth-child(1) { animation-delay: 1s; }
  .card.show .badge:nth-child(2) { animation-delay: 1.15s; }
  .card.show .badge:nth-child(3) { animation-delay: 1.3s; }

  .divider {
    display: flex; align-items: center; gap: 12px; justify-content: center;
    margin: 18px auto 22px; color: var(--rose);
  }
  .divider::before, .divider::after {
    content: ""; height: 1px; width: 80px;
    background: linear-gradient(90deg, transparent, var(--rose), transparent);
  }

  .message {
    min-height: 150px;
    font-family: 'Playfair Display', serif;
    font-size: clamp(16px, 2.4vw, 19px); line-height: 1.85;
    color: #6b4456;
  }
  .message .caret {
    display: inline-block; width: 2px; height: 1.1em; margin-left: 2px;
    background: var(--rose-deep); vertical-align: -3px;
    animation: caret 1s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }

  .signature {
    margin-top: 18px;
    font-family: 'Dancing Script', cursive; font-size: 28px; color: var(--rose-deep);
    opacity: 0; transition: opacity 1.4s ease;
  }
  .signature.show { opacity: 1; }

  .actions {
    margin-top: 26px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    opacity: 0; transition: opacity 1s ease .3s;
  }
  .actions.show { opacity: 1; }
  .btn {
    border: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 500; letter-spacing: .02em;
    padding: 12px 22px; border-radius: 999px;
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .btn-primary {
    color: #fff;
    background: linear-gradient(135deg, #ff7aa2, #e75480);
    box-shadow: 0 10px 24px rgba(231, 84, 128, .35);
  }
  a.btn { display: inline-block; text-decoration: none; }
  .btn-zalo {
    color: #fff;
    background: linear-gradient(135deg, #3aa0ff, #0068ff);
    box-shadow: 0 10px 24px rgba(0, 104, 255, .28);
  }
  .btn-ghost {
    color: var(--rose-deep);
    background: rgba(255,255,255,.7);
    box-shadow: inset 0 0 0 1px rgba(231, 84, 128, .35);
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); }
  .btn:active { transform: scale(.97); }

  .wish {
    margin-top: 16px; min-height: 26px;
    font-family: 'Dancing Script', cursive; font-size: 24px; color: #c9184a;
    transition: opacity .5s ease, transform .5s ease;
  }
  .wish.swap { opacity: 0; transform: translateY(8px); }

  .footer-note {
    position: fixed; bottom: 16px; left: 0; right: 0; z-index: 6;
    text-align: center; font-size: 12px; letter-spacing: .15em; color: rgba(138,75,99,.7);
    opacity: 0; animation: fadeUp 1s ease 3s forwards;
  }

  .music {
    position: fixed; top: 18px; right: 18px; z-index: 7;
    width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,.6); backdrop-filter: blur(8px);
    box-shadow: 0 6px 18px rgba(231,84,128,.25);
    font-size: 20px; color: var(--rose-deep);
    transition: transform .3s;
  }
  .music.on { animation: spin 6s linear infinite; }

  @media (max-width: 480px) {
    .card { padding: 44px 24px 32px; border-radius: 26px; }
    .envelope { width: 250px; height: 168px; }
  }
  @media (max-height: 720px) {
    .card { padding: 30px 32px 26px; }
    .name { font-size: clamp(70px, 14vh, 110px); }
    .divider { margin: 8px auto 12px; }
    .message { min-height: 0; line-height: 1.7; }
    .actions { margin-top: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="sky"></div>
<div class="rays"></div>
<div class="sun"></div>
<div id="clouds"></div>
<canvas id="fx"></canvas>

<button class="music" id="music" title="Bật nhạc nhẹ">♪</button>

<main class="stage">
  <!-- Phong thư -->
  <div class="envelope-wrap" id="envWrap">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Mở thư">
      <div class="body"></div>
      <div class="pocket"></div>
      <div class="flap"></div>
      <div class="seal">✦</div>
    </div>
    <p class="hint">Có thư từ đồng đội nè… chạm vô mở ra hỉ 🎮</p>
  </div>

  <!-- Thiệp -->
  <section class="card" id="card" aria-live="polite">
    <div class="greet-time" id="greetTime">Good morning</div>
    <div class="hello">Chào buổi sáng,</div>
    <div class="name"><span class="l">L</span><span class="l">A</span><span class="mini-heart">✦</span></div>

    <div class="badges">
      <span class="badge">🎯 Lane: Mid</span>
      <span class="badge">🔮 Main: Natalya</span>
      <span class="badge">🏆 Mood: Chuỗi thắng</span>
    </div>

    <div class="divider">❀</div>

    <p class="message" id="message"></p>
    <div class="signature" id="signature">— Một đồng đội đang chờ được mời vào trận 🎮</div>

    <div class="actions" id="actions">
      <button class="btn btn-primary" id="hugBtn">Vào trận hông? 🎮</button>
      <a class="btn btn-zalo" id="zaloBtn" href="#">Nhắn đồng đội 💬</a>
      <button class="btn btn-ghost" id="wishBtn">Rút buff hôm nay 🎲</button>
    </div>
    <div class="wish" id="wish"></div>
  </section>
</main>

<div class="footer-note" id="dateNote"></div>

<script>
(() => {
  /* ---------- Cấu hình liên kết ----------
     ZALO_PHONE: số điện thoại Zalo của bạn (vd "0912345678"). Để trống thì ẩn nút Zalo. */
  const ZALO_PHONE = "0363870817";
  const LQ = {
    androidPkg: "com.garena.game.kgvn",
    playStore:  "https://play.google.com/store/apps/details?id=com.garena.game.kgvn",
    appStore:   "https://apps.apple.com/vn/app/id1150288115"
  };

  /* ---------- Lời chúc ---------- */
  const lines = [
    "Dậy chưa rứa, Mid lane? Trụ đầu chưa vỡ mô, cứ từ từ đánh răng.",
    "Nhớ ăn sáng cho no — đọi cháo lươn hay tô bún chi cũng được, farm đủ rồi mới gánh team nha.",
    "Chúc bựa ni Natalya combo trúng hết, nỏ bị ai cướp mạng, đồng đội thì… chịu nghe lời.",
    "À, nếu đội hình còn thiếu một slot — thì có người đang online sẵn rồi đó 😌"
  ];
  const wishes = [
    "Buff hôm nay: không đi rừng nào dám lấy bùa xanh của em 💙",
    "Buff hôm nay: vào trận là được pick Mid, không ai tranh 🎯",
    "Buff hôm nay: team địch 5 xạ thủ, không đứa nào có khống chế 😌",
    "Buff hôm nay: Natalya một combo, một mạng, không hối hận 🔮",
    "Buff hôm nay: chuỗi thắng dài hơn cả thời gian chờ ghép trận",
    "Buff hôm nay: có thua thì chắc chắn tại team, không phải tại em 🙂",
    "Buff hôm nay: Penta kill trong game, mood cũng Penta ngoài đời ✨",
    "Buff hôm nay: support bỏ đường thì cứ ping, có người ra đứng cạnh (đứng thôi) 😅",
    "Buff hôm nay: thua trận cũng nỏ răng, ăn đọi cháo lươn là hết buồn 🍜",
    "Buff hôm nay: đồng đội mô feed thì cứ hỏi \"mi đi mô rứa?\" 😤",
    "Buff hôm nay: Natalya bấm một phát, địch nằm hết — ưng cái bụng chưa? 😎",
    "Buff hôm nay: rank lên vù vù, nỏ ai cản được mô 🚀",
    "Buff hôm nay: có người âm thầm cổ vũ, dù chỉ biết ngồi xem 👀",
    "Buff hôm nay: cười nhiều lên — nghe nói hiệu ứng đó gây sát thương diện rộng 🙂"
  ];

  /* ---------- Chào theo giờ ---------- */
  const now = new Date();
  const h = now.getHours();
  const greetTime = document.getElementById('greetTime');
  greetTime.textContent = h < 11 ? "Good morning · Mid lane dậy chưa rứa?" : h < 14 ? "Buổi trưa · Về nhà hồi máu thôi" : h < 18 ? "Buổi chiều · Giờ vàng leo rank" : "Tối rồi · Một trận nữa thôi rồi ngủ hỉ";
  const days = ["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"];
  document.getElementById('dateNote').textContent =
    `${days[now.getDay()]}, ${now.getDate()}.${now.getMonth()+1}.${now.getFullYear()} · bựa ni chúc LA toàn chữ Victory hỉ`;

  /* ---------- Mây ---------- */
  const cloudBox = document.getElementById('clouds');
  function makeCloud(i) {
    const c = document.createElement('div');
    c.className = 'cloud';
    const s = 0.6 + Math.random() * 0.8;
    c.style.top = (6 + Math.random() * 30) + 'vh';
    c.style.animationDuration = (60 + Math.random() * 60) + 's';
    c.style.animationDelay = (-Math.random() * 100) + 's';
    c.style.transform = `scale(${s})`;
    [[0,20,70],[40,0,90],[95,22,65],[30,30,110]].forEach(([x,y,d]) => {
      const p = document.createElement('span');
      p.style.left = x * s + 'px'; p.style.top = y * s + 'px';
      p.style.width = p.style.height = d * s + 'px';
      c.appendChild(p);
    });
    cloudBox.appendChild(c);
  }
  for (let i = 0; i < 5; i++) makeCloud(i);

  /* ---------- Canvas: cánh hoa, tim, lấp lánh ---------- */
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  let W, H, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize(); addEventListener('resize', resize);

  const petals = [], bursts = [], sparks = [];
  const petalColors = ['#ffc2d1', '#ffb3c6', '#ffd6e0', '#ff99b6', '#ffe0b5'];

  function newPetal(initial) {
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : -20,
      r: 6 + Math.random() * 8,
      vy: .4 + Math.random() * .9,
      vx: -.3 + Math.random() * .6,
      rot: Math.random() * Math.PI * 2,
      vr: -.02 + Math.random() * .04,
      sway: Math.random() * Math.PI * 2,
      color: petalColors[(Math.random() * petalColors.length) | 0],
      alpha: .55 + Math.random() * .4
    };
  }
  const PETALS = W < 600 ? 28 : 50;
  for (let i = 0; i < PETALS; i++) petals.push(newPetal(true));

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(0, -p.r);
    ctx.bezierCurveTo(p.r, -p.r, p.r, p.r * .6, 0, p.r);
    ctx.bezierCurveTo(-p.r, p.r * .6, -p.r, -p.r, 0, -p.r);
    ctx.fill();
    ctx.globalAlpha = p.alpha * .5;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = .8;
    ctx.beginPath(); ctx.moveTo(0, -p.r * .7); ctx.lineTo(0, p.r * .7); ctx.stroke();
    ctx.restore();
  }

  function heartPath(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * .3);
    ctx.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3);
    ctx.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s);
    ctx.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3);
    ctx.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3);
    ctx.closePath();
  }

  function burst(x, y, n = 24) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
      bursts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
        s: 10 + Math.random() * 16, life: 1,
        hue: Math.random() < .5 ? 40 + Math.random() * 10 : 330 + Math.random() * 30,
        rot: (Math.random() - .5) * .6,
        heart: Math.random() < .12 // thỉnh thoảng mới lọt một trái tim
      });
    }
  }

  function sparkle(x, y) {
    sparks.push({ x, y, life: 1, s: 1.5 + Math.random() * 2.5, vx: (Math.random() - .5) * .8, vy: -Math.random() * .8 });
  }

  function starPath(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }

  // Đốm nắng (bokeh) trôi lên chậm rãi ở nền
  const floaters = [];
  setInterval(() => {
    if (floaters.length < 14) floaters.push({
      x: Math.random() * W, y: H + 30, s: 12 + Math.random() * 18,
      vy: .5 + Math.random() * .7, ph: Math.random() * 6, a: .15 + Math.random() * .25
    });
  }, 900);

  function tick() {
    ctx.clearRect(0, 0, W, H);

    for (const f of floaters) {
      f.y -= f.vy; f.ph += .02;
      ctx.save();
      ctx.globalAlpha = f.a * Math.min(1, (f.y) / 200);
      const fx = f.x + Math.sin(f.ph) * 20;
      const g = ctx.createRadialGradient(fx, f.y, 0, fx, f.y, f.s);
      g.addColorStop(0, 'rgba(255,236,200,.9)'); g.addColorStop(1, 'rgba(255,190,200,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(fx, f.y, f.s, 0, Math.PI * 2);
      ctx.fill(); ctx.restore();
    }
    for (let i = floaters.length - 1; i >= 0; i--) if (floaters[i].y < -40) floaters.splice(i, 1);

    for (const p of petals) {
      p.sway += .015;
      p.x += p.vx + Math.sin(p.sway) * .6;
      p.y += p.vy; p.rot += p.vr;
      if (p.y > H + 20 || p.x < -30 || p.x > W + 30) Object.assign(p, newPetal(false));
      drawPetal(p);
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.x += b.vx; b.y += b.vy; b.vy += .08; b.vx *= .98; b.life -= .014;
      if (b.life <= 0) { bursts.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = b.life;
      ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = `hsl(${b.hue}, 90%, ${65 + (1 - b.life) * 15}%)`;
      ctx.shadowColor = 'rgba(255,200,150,.6)'; ctx.shadowBlur = 10;
      if (b.heart) heartPath(0, -b.s / 2, b.s); else starPath(0, 0, b.s / 2);
      ctx.fill(); ctx.restore();
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.life -= .025;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = s.life;
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#ffd98e'; ctx.shadowBlur = 12;
      ctx.translate(s.x, s.y);
      ctx.beginPath();
      for (let k = 0; k < 4; k++) {
        ctx.rotate(Math.PI / 2);
        ctx.moveTo(0, 0); ctx.quadraticCurveTo(s.s * .3, s.s * .3, 0, s.s * 2.2);
      }
      ctx.fill(); ctx.restore();
    }

    requestAnimationFrame(tick);
  }
  tick();

  // Vệt lấp lánh theo con trỏ / ngón tay
  let last = 0;
  function trail(x, y) {
    const t = performance.now();
    if (t - last > 28) { sparkle(x, y); last = t; }
  }
  addEventListener('mousemove', e => trail(e.clientX, e.clientY));
  addEventListener('touchmove', e => { const t = e.touches[0]; trail(t.clientX, t.clientY); }, { passive: true });
  addEventListener('click', e => {
    if (e.target.closest('button, .envelope')) return;
    burst(e.clientX, e.clientY, 14);
  });

  /* ---------- Mở thư & gõ chữ ---------- */
  const env = document.getElementById('envelope');
  const envWrap = document.getElementById('envWrap');
  const card = document.getElementById('card');
  const msg = document.getElementById('message');
  let opened = false;

  function openLetter() {
    if (opened) return; opened = true;
    env.classList.add('open');
    const r = env.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 40);
    setTimeout(() => envWrap.classList.add('gone'), 700);
    setTimeout(() => { card.classList.add('show'); setTimeout(typeAll, 600); }, 900);
  }
  env.addEventListener('click', openLetter);
  env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLetter(); } });

  function typeAll() {
    const caret = document.createElement('span');
    caret.className = 'caret';
    let li = 0, ci = 0;
    msg.appendChild(caret);
    function step() {
      if (li >= lines.length) {
        setTimeout(() => {
          caret.remove();
          document.getElementById('signature').classList.add('show');
          document.getElementById('actions').classList.add('show');
        }, 600);
        return;
      }
      const line = lines[li];
      if (ci < line.length) {
        caret.before(document.createTextNode(line[ci++]));
        const ch = line[ci - 1];
        setTimeout(step, /[,.—]/.test(ch) ? 110 : 14 + Math.random() * 10);
      } else {
        li++; ci = 0;
        if (li < lines.length) caret.before(document.createElement('br'));
        setTimeout(step, 220);
      }
    }
    step();
  }

  /* ---------- Nút tương tác ---------- */
  const wishEl = document.getElementById('wish');
  let wi = -1;
  document.getElementById('wishBtn').addEventListener('click', e => {
    wishEl.classList.add('swap');
    setTimeout(() => {
      let n; do { n = (Math.random() * wishes.length) | 0; } while (n === wi && wishes.length > 1);
      wi = n; wishEl.textContent = wishes[n];
      wishEl.classList.remove('swap');
    }, 350);
    const r = e.currentTarget.getBoundingClientRect();
    for (let i = 0; i < 18; i++) setTimeout(() => sparkle(r.left + Math.random() * r.width, r.top + Math.random() * r.height), i * 25);
  });

  document.getElementById('hugBtn').addEventListener('click', () => {
    for (let i = 0; i < 6; i++) setTimeout(() => burst(Math.random() * W, H * (.2 + Math.random() * .6), 22), i * 180);
    wishEl.classList.add('swap');
    setTimeout(() => { wishEl.textContent = "Đang vào sảnh chờ… bấm Sẵn sàng hỉ 😄"; wishEl.classList.remove('swap'); }, 350);
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    // Trình duyệt chỉ cho mở app khi chuyển trang ngay trong cú chạm → không được trì hoãn
    openLienQuan();
  });

  /* ---------- Mở app ---------- */
  const ua = navigator.userAgent;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function openLienQuan() {
    if (isAndroid) {
      // Chrome không cho web mở thẳng màn hình chính của game (không có BROWSABLE),
      // nên nhờ CH Play mở hộ: market://launch → nếu đã cài thì CH Play bật game,
      // nếu không thì hiện trang game trên CH Play (có nút "Chơi"/"Cài đặt").
      location.href = `intent://launch?id=${LQ.androidPkg}#Intent;scheme=market;package=com.android.vending;` +
        `S.browser_fallback_url=${encodeURIComponent(LQ.playStore)};end`;
    } else if (isIOS) {
      // iOS không cho web mở thẳng game → mở trang App Store (có sẵn nút "Mở")
      location.href = LQ.appStore;
    } else {
      window.open(LQ.playStore, '_blank');
    }
  }

  const zaloBtn = document.getElementById('zaloBtn');
  if (!ZALO_PHONE) zaloBtn.style.display = 'none';
  // Link thật (thẻ <a>) để iPhone/Android nhận là Universal Link → mở thẳng app Zalo tới khung chat
  zaloBtn.href = `https://zalo.me/${ZALO_PHONE.replace(/\D/g, '')}`;
  zaloBtn.addEventListener('click', () => {
    const r = zaloBtn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 16);
  });

  /* ---------- Nhạc nền nhẹ (Web Audio, không cần file) ---------- */
  const musicBtn = document.getElementById('music');
  let audio, playing = false, timer;
  const melody = [ // hộp nhạc: C major, nhẹ nhàng
    [72,1],[76,1],[79,1],[84,2],[83,1],[79,1],[76,2],
    [74,1],[77,1],[81,1],[79,2],[76,1],[72,1],[74,2],
    [72,1],[76,1],[79,1],[84,2],[86,1],[84,1],[81,2],
    [79,1],[77,1],[76,1],[74,1],[72,4]
  ];
  function note(midi, t, dur) {
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.12, t + .02);
    g.gain.exponentialRampToValueAtTime(.0005, t + dur * 2.2);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + dur * 2.4);
  }
  function loop() {
    const beat = .32; let t = audio.currentTime + .05;
    melody.forEach(([m, d]) => { note(m, t, beat * d); if (d >= 2) note(m - 12, t, beat * d); t += beat * d; });
    timer = setTimeout(loop, (t - audio.currentTime) * 1000);
  }
  musicBtn.addEventListener('click', () => {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    playing = !playing;
    musicBtn.classList.toggle('on', playing);
    musicBtn.textContent = playing ? '♫' : '♪';
    if (playing) { audio.resume(); loop(); } else { clearTimeout(timer); audio.suspend(); }
  });
})();
</script>
</body>
</html>
